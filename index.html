<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjectif Creation</title>
<meta name="description" content="Adjectif Creation — multidisciplinary design and research studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cover.css">
<script>
  /* Repeat visitors this session skip straight to the homepage — no
     flash of the cover, redirect before first paint. */
  if (sessionStorage.getItem('adjectif-cover-seen')) {
    window.location.replace('home.html');
  }
</script>
</head>
<body>

<a href="home.html" class="sr-only">Skip intro, go to homepage</a>

<div class="cover" id="cover">
  <canvas class="cover__canvas" id="cover-canvas" aria-hidden="true"></canvas>

  <div class="cover__prompt" id="cover-prompt">
    <span class="cover__prompt-label cover__prompt-label--mouse">Move your mouse</span>
    <span class="cover__prompt-label cover__prompt-label--touch">Touch and drag</span>
    <svg class="cover__prompt-arrow" viewBox="0 0 64 20" fill="none" aria-hidden="true">
      <line x1="2" y1="10" x2="50" y2="10" stroke="var(--navy-soft)" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M44 4 L56 10 L44 16" stroke="var(--navy-soft)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <svg class="cover__pencil" id="cover-pencil" viewBox="0 0 30 30" fill="none" aria-hidden="true">
    <line x1="19" y1="11" x2="23" y2="7" stroke="#2B3A6B" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="5" y1="25" x2="23" y2="7" stroke="#2B3A6B" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 25 L2 28 L3 23 Z" fill="#2B3A6B" stroke="#2B3A6B" stroke-width="1" stroke-linejoin="round"/>
  </svg>

  <button class="cover__clear" id="cover-clear" type="button">
    <span class="mark mark--sm"></span>
    Clear
  </button>

  <div class="cover__fade" id="cover-fade"></div>
</div>

<script src="js/cover.js"></script>
</body>
</html>
