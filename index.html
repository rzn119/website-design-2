<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjectif Creation</title>
<meta name="description" content="Adjectif Creation — multidisciplinary design and research studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@400;500;600&family=Big+Shoulders+Stencil+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/mesh.css">
<link rel="stylesheet" href="css/cover.css">
<script>
  /* Repeat visitors this session skip straight to the homepage — no
     flash of the cover, redirect before first paint. */
  if (sessionStorage.getItem('adjectif-cover-seen')) {
    window.location.replace('home.html');
  }
</script>
</head>
<body>

<a href="home.html" class="sr-only">Skip intro, go to homepage</a>

<div class="cover" id="cover">

  <div class="mesh-bg mesh-bg--cover" aria-hidden="true">
    <div class="mesh-blob" style="--blob-color: var(--teal); --blob-size: 58vw; --blob-top: -16%; --blob-left: -12%; --blob-opacity: 0.55; --blob-blur: 90px; --blob-duration: 4.5s; --blob-delay: 0s;"></div>
    <div class="mesh-blob" style="--blob-color: var(--sage); --blob-size: 52vw; --blob-top: 32%; --blob-left: 28%; --blob-opacity: 0.5; --blob-blur: 85px; --blob-duration: 5.5s; --blob-delay: 1.2s;"></div>
    <div class="mesh-blob" style="--blob-color: var(--olive); --blob-size: 46vw; --blob-top: 52%; --blob-left: 54%; --blob-opacity: 0.45; --blob-blur: 90px; --blob-duration: 4s; --blob-delay: 0.6s;"></div>
    <div class="mesh-blob" style="--blob-color: var(--cream); --blob-size: 40vw; --blob-top: 6%; --blob-left: 48%; --blob-opacity: 0.65; --blob-blur: 100px; --blob-duration: 6s; --blob-delay: 2s;"></div>
    <div class="mesh-grain"></div>
  </div>

  <canvas class="cover__canvas" id="cover-canvas" aria-hidden="true"></canvas>

  <span class="cover__eyebrow" aria-hidden="true">Multidisciplinary Design &amp; Research Studio</span>

  <h1 class="cover__title" id="cover-title">
    <span class="sr-only">Adjectif Creation</span>
    <span class="cover__word" aria-hidden="true"><span class="cover__letter">A</span><span class="cover__letter">D</span><span class="cover__letter">J</span><span class="cover__letter">E</span><span class="cover__letter">C</span><span class="cover__letter">T</span><span class="cover__letter">I</span><span class="cover__letter">F</span></span> <span class="cover__word" aria-hidden="true"><span class="cover__letter">C</span><span class="cover__letter">R</span><span class="cover__letter">E</span><span class="cover__letter">A</span><span class="cover__letter">T</span><span class="cover__letter">I</span><span class="cover__letter">O</span><span class="cover__letter">N</span></span>
  </h1>

  <div class="cover__prompt" id="cover-prompt">
    <span class="cover__prompt-label cover__prompt-label--mouse">Move your mouse — scroll to enter ↓</span>
    <span class="cover__prompt-label cover__prompt-label--touch">Touch and drag — tap to enter ↓</span>
  </div>

  <svg class="cover__crayon" id="cover-crayon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
    <line x1="8" y1="24" x2="24" y2="8" stroke="var(--crayon-color, var(--olive))" stroke-width="8" stroke-linecap="round"/>
    <line x1="8" y1="24" x2="24" y2="8" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.12"/>
    <circle cx="8" cy="24" r="2.6" fill="var(--cream)" opacity="0.55"/>
  </svg>

  <button class="cover__clear" id="cover-clear" type="button">
    <span class="mark mark--sm"></span>
    Clear
  </button>

  <div class="cover__fade" id="cover-fade"></div>
</div>

<script src="js/cover.js"></script>
</body>
</html>
